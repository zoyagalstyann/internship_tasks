<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brew & Bean Task Tracker</title>
  <style>
    :root {
      --color-bg: #f4efe9;
      --color-surface: #ffffff;
      --color-surface-alt: #fdfbf7;
      --color-border: #e2dad0;
      --color-text-main: #1f2421;
      --color-text-muted: #717774;
      --color-primary: #1f2421;
      --color-accent: #c86d51;
      --color-accent-hover: #b05a40;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--color-bg);
      color: var(--color-text-main);
      display: flex;
      justify-content: center;
      padding: 4rem 1rem;
      line-height: 1.5;
    }

    .app-container {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 8px;
      padding: 2rem;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 10px 25px -5px rgba(31, 36, 33, 0.05);
    }

    .app-header {
      border-bottom: 1px solid var(--color-border);
      padding-bottom: 1rem;
      margin-bottom: 1.5rem;
    }

    .app-header__title {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--color-text-main);
    }

    .todo-form {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    .todo-input {
      flex: 1;
      padding: 0.75rem 1rem;
      border: 1px solid var(--color-border);
      border-radius: 6px;
      font-size: 0.9rem;
      background-color: var(--color-surface-alt);
      color: var(--color-text-main);
      outline: none;
      transition: border-color 0.2s ease, background-color 0.2s ease;
    }

    .todo-input:focus {
      border-color: var(--color-primary);
      background-color: var(--color-surface);
    }

    .btn {
      padding: 0.75rem 1.25rem;
      background-color: var(--color-primary);
      color: var(--color-surface);
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.875rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      transition: background-color 0.2s ease;
    }

    .btn:hover {
      background-color: var(--color-accent);
    }

    .todo-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .todo-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.875rem 1rem;
      background: var(--color-surface-alt);
      border: 1px solid var(--color-border);
      border-radius: 6px;
      transition: border-color 0.2s ease;
    }

    .todo-item:hover {
      border-color: #d1c5b8;
    }

    .todo-item__content {
      display: flex;
      align-items: center;
      gap: 0.875rem;
    }

    .todo-item__checkbox {
      width: 1.1rem;
      height: 1.1rem;
      accent-color: var(--color-primary);
      cursor: pointer;
    }

    .todo-item__text {
      font-size: 0.925rem;
      color: var(--color-text-main);
      transition: color 0.2s ease;
    }

    .todo-item__text--completed {
      text-decoration: line-through;
      color: var(--color-text-muted);
    }

    .btn-delete {
      background: none;
      border: none;
      color: var(--color-text-muted);
      cursor: pointer;
      font-size: 1rem;
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      transition: color 0.2s ease, background-color 0.2s ease;
    }

    .btn-delete:hover {
      color: var(--color-accent);
      background-color: rgba(200, 109, 81, 0.08);
    }
  </style>
</head>
<body>

  <main class="app-container">
    <header class="app-header">
      <h1 class="app-header__title">Task Tracker</h1>
    </header>
    
    <form id="todoForm" class="todo-form">
      <input type="text" id="todoInput" class="todo-input" placeholder="Add a new task..." required>
      <button type="submit" class="btn">Add Task</button>
    </form>

    <ul id="todoList" class="todo-list"></ul>
  </main>

  <script src="app.js"></script>
</body>
</html>
